# The ruff `rev` here MUST match the ruff version pixi installs, or `format-check`
# oscillates between local hooks and CI. Check with: pixi run ruff --version
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      # Model weights belong on the HF Hub, not in git. This is the backstop.
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
        # Frozen third-party training configs preserved verbatim as historical record.
        exclude: ^docs/provenance/configs/
      - id: ruff-format
        exclude: ^docs/provenance/configs/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.0
          - types-PyYAML
