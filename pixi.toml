[workspace]
name = "object-detection-eval"
version = "0.1.0"
description = "Reproducible evaluation harness for object detection networks on small datasets"
authors = ["Enrique G. Ortiz <ortizeg@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
test = "pytest"
test-cov = "pytest --cov=src --cov-report=term --cov-report=xml -v"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src/"
precommit = "pre-commit run --all-files"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
docs-stage = "python scripts/stage_docs.py"
docs = { cmd = "mkdocs serve", depends-on = ["docs-stage"] }
docs-build = { cmd = "mkdocs build", depends-on = ["docs-stage"] }

# Core: no torch, no lightning. Must stay importable without a deep-learning stack.
[dependencies]
python = "3.11.*"
numpy = "<2.0.0"
pydantic = ">=2.0"
hydra-core = "*"
loguru = "*"
pycocotools = "*"
matplotlib = "*"
opencv = "*"
tqdm = "*"
pyyaml = "*"
httpx = "*"

[pypi-dependencies]
onnxruntime = ">=1.23.2, <2"
supervision = "==0.29.1"
orjson = "*"
object-detection-eval = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
mkdocs = "*"
mkdocs-material = "*"

[feature.dev.pypi-dependencies]
mkdocstrings = { version = "*", extras = ["python"] }
huggingface-hub = "*"
types-PyYAML = "*"

# Zero-shot VLM inferencers. Heavy — opt in explicitly.
[feature.vlm.dependencies]
pytorch = "*"
torchvision = "*"

[feature.vlm.pypi-dependencies]
transformers = ">=4.49.0, <4.52.0"
timm = "*"
einops = "*"
peft = "*"
num2words = "*"
google-genai = ">=1.63.0, <2"
# YOLO-World. AGPL-3.0, optional-extra-only — see pyproject's [vlm] note.
ultralytics = ">=8.3, <9"
# YOLO-World's prompt-then-detect encodes the class vocabulary with CLIP.
# ultralytics does NOT vendor it: set_classes() falls back to pip-installing
# `git+https://github.com/ultralytics/CLIP.git` AT RUNTIME, which silently
# mutates a pixi-locked environment and is not reproducible. Declaring the
# PyPI packaging (MIT) here keeps the env solved and locked.
clip-anytorch = "*"

# Qwen3-VL-8B zero-shot inferencer. A SEPARATE feature from [feature.vlm],
# not an addition to it: Qwen3-VL requires transformers>=4.57.0, and
# [feature.vlm]'s pin (`<4.52.0`, see its comment) is explicitly load-bearing
# for the six already-published zero-shot rows — bumping it would mean
# re-validating their whole reproduction gate on GPU to add one new row. The
# two pins cannot coexist in one pixi environment, so this is a second,
# fully-isolated one: `pixi run -e vlm ...` never sees transformers>=4.57, and
# `pixi run -e vlm-qwen3vl ...` never sees the <4.52 pin.
[feature.qwen3vl.dependencies]
pytorch = "*"
torchvision = "*"

[feature.qwen3vl.pypi-dependencies]
transformers = ">=4.57.0,<5"
# Required for Qwen3VLForConditionalGeneration.from_pretrained(device_map=...)
# -- transformers raises ValueError without it.
accelerate = "*"

# Cross-platform ONNX graph-surgery tooling (LAT-03). onnx + onnx-graphsurgeon
# both ship osx-arm64 AND linux-64 wheels (onnx-graphsurgeon is a pure-Python
# universal wheel), so the EfficientNMS_TRT graft script develops and CPU-unit-
# tests on this macOS machine with NO GPU. This feature deliberately does NOT
# pull onnxruntime-gpu, so it never conflicts with the core CPU onnxruntime.
[feature.graphsurgeon.pypi-dependencies]
onnx = ">=1.22,<2"
onnx-graphsurgeon = ">=0.6.1"

# TensorRT engine build + benchmark (LAT-02) + graph tooling. Linux-64 + NVIDIA
# T4 only. This feature is fully specified but INTENTIONALLY NOT composed into
# [environments] below on this repo's default (macOS) host — see the long note
# at [environments] for why. On the T4 (a linux-64 host) it is activated via
# `no-default-feature = true` so it EXCLUDES the core CPU `onnxruntime` pypi-
# dependency and installs `onnxruntime-gpu` instead — the two cannot coexist in
# one env (06-RESEARCH.md Pitfall 1). The core conda deps + the non-onnxruntime
# core pypi deps are re-listed here because no-default-feature drops the default
# feature entirely.
# CUDA-backed VLM environment (linux-64 + NVIDIA only). Same story as
# [feature.trt] below: fully specified here, but DELIBERATELY NOT composed into
# [environments], because pixi cannot solve a linux-64-only env from this
# macOS host.
#
# It exists because conda-forge's `pytorch` resolves to the CPU build on
# linux-64 unless the GPU variant is requested explicitly. The `vlm` env is
# therefore CPU-only on Linux — fine on macOS, where torch uses MPS, but it
# silently turns a rented GPU box into a slow CPU box. `pytorch-gpu` is the
# metapackage that pins the CUDA variant; it has no osx-arm64 build, which is
# exactly why this cannot live in [feature.vlm].
#
# Activate on the GPU host by adding this line to [environments] there:
#
#   vlm-cuda = ["dev", "vlm", "vlmcuda"]
#
# then `pixi install -e vlm-cuda`. Verify with torch.cuda.is_available() before
# trusting any timing or believing a run used the GPU.
#
# `vlmcuda` composes with `qwen3vl` exactly the same way — it only pins
# `pytorch-gpu` and has no opinion on the transformers version, so the same
# feature covers both zero-shot environments' GPU needs:
#
#   vlm-qwen3vl-cuda = ["dev", "qwen3vl", "vlmcuda"]
[feature.vlmcuda]
platforms = ["linux-64"]

# REQUIRED, and not obvious: without it the solve fails with "pytorch 2.5.1
# would require __cuda *, for which no candidates were found". conda-forge gates
# the CUDA builds on a `__cuda` virtual package that pixi does not detect inside
# a container even when the driver is present and nvidia-smi works. This is the
# pixi-native override; CONDA_OVERRIDE_CUDA does NOT work here. Verified on an
# RTX A4000 (driver 565.57.01) 2026-08-01.
[feature.vlmcuda.system-requirements]
cuda = "12"

[feature.vlmcuda.dependencies]
# Unpinned, `pytorch-gpu = "*"` resolves to pytorch 1.6.0 and then fails on
# python >=3.6,<3.7. The lower bound keeps the solve on a modern build.
pytorch-gpu = ">=2.5,<3"
# Required for Qwen3-VL specifically (not the other five GPU-eligible rows):
# its rotary-embedding forward path (transformers>=4.57's
# modeling_qwen3_vl.py) JIT-compiles a Triton kernel at generate() time, and
# Triton's build shells out to `gcc` for `cuda_utils.c`, which needs the CUDA
# *driver API* header (`cuda.h`) -- something the `pytorch-gpu` runtime alone
# does not ship. Without it, `predict()`'s catch-all exception handler
# silently swallows a `subprocess.CalledProcessError` and returns `[]`, which
# reads exactly like a model failing to ground rather than an environment gap
# (confirmed on the rented RTX 4090, 2026-08-18). `cuda-compiler` lives here
# rather than in `[feature.qwen3vl]` because it is linux-64-only and would
# break solving the cross-platform `vlm-qwen3vl` (CPU/MPS) environment on
# macOS; `vlmcuda` is already linux-64-gated.
cuda-compiler = "12.*"

[feature.trt]
platforms = ["linux-64"]

[feature.trt.dependencies]
python = "3.11.*"
# `pip` is REQUIRED here, not incidental: the editable install documented at
# [environments] below (`pixi run -e trt pip install -e . --no-deps`) fails with
# `pip: command not found` without it, because no other dependency in this
# feature pulls pip in. Verified on the 2026-07-30 dedicated-T4 run.
pip = "*"
numpy = "<2.0.0"
pydantic = ">=2.0"
hydra-core = "*"
loguru = "*"
pycocotools = "*"
matplotlib = "*"
opencv = "*"
tqdm = "*"
pyyaml = "*"
httpx = "*"

[feature.trt.pypi-dependencies]
# Core pypi deps EXCEPT onnxruntime (replaced by onnxruntime-gpu below).
# NOTE: the editable `object-detection-eval` path dep is intentionally NOT
# re-listed here. pixi cannot build a path/editable dependency for a linux-64-
# ONLY environment from a non-linux (osx-arm64) host — there is no linux Python
# interpreter available to run the build backend, so the lock solve fails. The
# graft script (graft_efficientnms.py) and the trtexec wrapper never import
# object_detection_eval, so trt does not need it. For LAT-01's on-T4 e2e latency
# run (Plan 06-03), install the package into this env ON the linux box after
# creation:  `pixi run -e trt pip install -e . --no-deps`.
supervision = "==0.29.1"
orjson = "*"
# TensorRT stack — pinned to the 06-RESEARCH.md-verified versions.
#
# ⚠ `tensorrt` ships the PYTHON BINDING ONLY — it does NOT install the
# `trtexec` CLI. scripts/build_trt_engines.py shells out to `trtexec`
# (`--trtexec`, default `"trtexec"` on PATH), so this environment ALONE cannot
# run LAT-02: `trtexec` is absent from the solved env entirely. Supply it
# externally on the T4 — either the NGC container
# (`nvcr.io/nvidia/tensorrt:24.08-py3` ships trtexec 10.3.0) or a TensorRT
# tarball — and pass its path via `--trtexec`.
#
# ⚠ The binding version below and the `trtexec` you supply CAN DIFFER, and the
# builder is what describes the artifacts. resolve_trt_version() therefore reads
# the `--trtexec` binary first (the 2026-07-30 run had binding 10.16.1.11 vs
# builder 10.3.0), so keep `--trtexec` pointed at the binary you actually want
# recorded in the results file.
onnxruntime-gpu = ">=1.28.0,<2"
tensorrt = ">=10.16,<11"
onnx = ">=1.22,<2"
onnx-graphsurgeon = ">=0.6.1"

[environments]
default = ["dev"]
vlm = ["dev", "vlm"]
# Qwen3-VL-8B only — isolated from `vlm` because it needs a newer transformers
# than the other six zero-shot rows are pinned to. See [feature.qwen3vl]'s
# comment above.
vlm-qwen3vl = ["dev", "qwen3vl"]
# Cross-platform: core (CPU onnxruntime) + dev + the graph-surgery tooling.
# This is the env the LAT-03 graft script + its graphsurgeon-marked test use on
# THIS macOS machine (no GPU needed for offline graph surgery).
graphsurgeon = ["dev", "graphsurgeon"]
prod = []

# NOTE — the `trt` environment is DELIBERATELY not declared here. pixi locks
# every declared environment across its platforms on `pixi install`, and it
# cannot solve a linux-64-ONLY environment whose PyPI deps require a build
# dispatch (`tensorrt` is an sdist stub; `onnxruntime-gpu` needs a build backend)
# from a non-linux host — there is no osx-arm64 interpreter for the linux-only
# env, so the solve aborts ("no compatible Python interpreter for 'osx-arm64'").
# The [feature.trt] block above is the ready-to-use recipe. On the T4 (a
# linux-64 host, Plan 06-03), activate it by adding this line and running
# `pixi install -e trt` — the lock solves natively there:
#
#   trt = { features = ["trt", "dev"], no-default-feature = true }
#
# Then install the editable package (not lockable cross-platform, see the
# [feature.trt.pypi-dependencies] note):  `pixi run -e trt pip install -e . --no-deps`
# `no-default-feature = true` is what keeps the core CPU `onnxruntime` OUT of the
# env so it cannot conflict with `onnxruntime-gpu` (06-RESEARCH.md Pitfall 1).
