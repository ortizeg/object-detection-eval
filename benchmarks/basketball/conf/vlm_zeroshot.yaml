# vlm_zeroshot.yaml -- VLM-01/VLM-02 zero-shot VLM run-and-reproduce manifest.
#
# Five zero-shot VLMs, scored over the 94-image basketball test split through
# the identical load_coco_gt -> predict -> remap_detections(merged5) ->
# filters.area_outliers -> filters.single_best_per_class -> compute_metrics
# path as the ONNX detectors in reproduction_640.yaml.
#
# `classes` is each model's own prompt/label vocabulary (index = the raw
# label id passed to remap_detections as that model's label_map). COCO/
# VLM-prompt vocabulary ("person", "sports ball", "basketball hoop", ...) is
# resolved into the merged5 canonical classes via merged5.yaml's `aliases`
# block -- no code edit needed per model. Gemini is prompted directly with the
# canonical class names, so no alias resolution applies to its row.
#
# `tolerance` (0.02 absolute mAP@50:95) is wider than the 7-detector
# reproduction gate's 0.01 (reproduction_640.yaml) -- VLM inference is
# noisier (HF post-processing version drift across transformers releases,
# non-deterministic generation for the two generative models). A divergence
# beyond it is a defect to investigate (prompt/threshold/preprocessing), NOT
# a tolerance to widen.
#
# `expected_map5095` is the published test mAP@50:95 for each row. It stays
# OPTIONAL (null is accepted, VLM-02): a row may run and emit a results file
# without asserting a target. No current row uses that, but the capability is
# retained for adding an exploratory model without gating the reproduction run.

# PROMPT SELECTION (2026-08-01). Each open-weights row's `classes` is no longer
# hand-chosen: it is whichever of the six shared candidates in
# vlm_prompt_search.yaml scored best FOR THAT MODEL on the 96-image VAL split.
# Every model faced the identical candidate set, so "equal tuning effort" is a
# property of the config rather than a claim. The winners differ by model --
# bare canonical names for OmDet-Turbo and Florence-2, domain vocabulary for
# OWLv2 and Grounding-DINO, the generic COCO list for YOLO-World -- which is
# precisely why one shared vocabulary would NOT have been the fair choice.
#
# Gemini is excluded from the search: billed API, and its prompt is a free-text
# instruction rather than a class vocabulary. It keeps its hand-tuned prompt and
# the report says so.

# SINGLETON FILTER (2026-08-03). filters.single_best_per_class now keeps the top
# THREE ball/rim candidates per image rather than the top one. Top-1 was
# discarding correct detections, not duplicates: OWLv2 produced a correct ball
# box in 90.9% of val images but ranked it first in only 51.1%. Every target
# below was measured under top-k=3; they are NOT comparable to numbers published
# before that date.

tolerance: 0.02

models:
  - name: gemini
    inferencer: gemini
    model_name: gemini-3.1-pro-preview
    classes:
      - ball
      - number
      - player
      - referee
      - rim
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
    # 0.250, not the 0.265 this line carried from Phase 5 until 2026-08-07.
    # `results/vlm/gemini.json` -- the dump every published Gemini number is
    # computed from, and which no later work re-ran -- scores 0.2497. The stale
    # target sat 0.0153 away from it, inside the 0.02 tolerance, so the
    # reproduction gate passed and nothing surfaced the drift. It also spent 77%
    # of the tolerance budget before a run started, which would have masked a
    # real regression and could have failed a legitimate re-run in the other
    # direction. The published report was always correct: it renders from the
    # dump, not from this value.
    expected_map5095: 0.250

  # ABLATION (2026-08-04). 2x2 overlapping tiles plus the full frame, and NMS
  # re-tuned INSIDE that regime. val 0.2400 -> 0.2879.
  #
  # The NMS value is the whole lesson of this row. Swept on whole frames, this
  # model's optimum was IoU 1.0 — no suppression at all, worth +0.0075, because
  # at 0.3 NMS was deleting genuinely distinct overlapping players rather than
  # duplicates. Carried into the tiled configuration unchanged it scored 0.2424,
  # WORSE than tiling alone at 0.2831, because tiling runs five overlapping
  # crops and manufactures the duplicates "suppress nothing" was chosen to keep.
  # Re-swept under tiling the optimum is 0.5.
  - name: owlv2
    inferencer: owlv2
    model_name: google/owlv2-large-patch14-ensemble
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.01
    nms_iou_threshold: 0.5
    tiles: [2, 2]
    expected_map5095: 0.315

  # PROMPT EQUALISED (2026-08-01). This row ran the generic COCO list while
  # OWLv2/Grounding-DINO/Florence-2 had domain vocabulary -- the last known
  # fairness gap in this table. It now uses whichever of the SIX shared
  # candidates in vlm_prompt_search.yaml scored best for it on the VAL split:
  # c5_bare_canonical (val mAP 0.1804, vs 0.1705 for the COCO list it replaces).
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.1796. The pre-2026-08-01
  # 0.173 was measured with the generic COCO list and described a different
  # configuration entirely.
  # ABLATION (2026-08-04). val 0.1806 -> 0.2159, from tiling (+0.0259) and a
  # per-class vocabulary (+0.0060). Every other knob was inside noise — this was
  # the model nothing helped until tiling.
  #
  # processor_nms_threshold is now stated. It was never passed before, so it sat
  # at the transformers default while the manifest documented the OUTER NMS as
  # this model's setting; the inner pass runs first and on the full candidate
  # set, which is why the outer one measured as a no-op above 0.5.
  - name: omdet_turbo
    inferencer: omdet_turbo
    model_name: omlab/omdet-turbo-swin-tiny-hf
    classes:
      - basketball player
      - basketball
      - referee
      - rim
      - number
    box_threshold: 0.01
    nms_iou_threshold: 0.5
    processor_nms_threshold: 0.5
    tiles: [2, 2]
    expected_map5095: 0.211

  # PROMPT PARITY (2026-07-30): given the same domain-specific vocabulary
  # OWLv2 already had. Previously it received a generic COCO list while Gemini
  # got a hand-tuned prompt, so the comparison measured prompt effort as much as
  # model capability -- the same unfairness the detector report refuses to
  # tolerate for training recipes.
  #
  # text_threshold 0.01 -> 0.25 (Grounding DINO's published default). At 0.01
  # nearly every text token activated, the returned label spanned the whole
  # caption, and label resolution collapsed: 533 detections/image, 99.7%
  # `person`, and the ball found ONCE in 94 images.
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.2338. The previously
  # published 0.147 came from the broken configuration. The repair is dramatic
  # and worth recording: detections fell from 533/image to ~15, the dump shrank
  # 10.5 MB -> 260 KB, `ball` went 0.000 -> 0.319 and `referee` 0.000 -> 0.237.
  # This row went from looking like the second-worst model in the table to the
  # second-best open-weights one, 0.012 behind OWLv2.
  - name: grounding_dino
    inferencer: grounding_dino
    model_name: IDEA-Research/grounding-dino-base
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.01
    text_threshold: 0.25
    # ABLATION (2026-08-04): 2x2 tiling, +0.0332 on val, almost all of it
    # `referee` (0.239 -> 0.445). NMS re-tuned under tiling: 0.5 -> 0.7.
    nms_iou_threshold: 0.7
    tiles: [2, 2]
    expected_map5095: 0.293

  # TASK TOKEN FIXED (2026-07-30). This ran with `<OD>` -- Florence-2's CLOSED
  # -vocabulary mode, which can only emit its own pretrained label set and
  # cannot be steered by `classes` at all. The result was 923 of 924 detections
  # labelled `person` and 0.000 AP on three of five classes: a measurement of
  # the wrong operating mode, not of the model.
  #
  # `<CAPTION_TO_PHRASE_GROUNDING>` is the open-vocabulary path: it grounds the
  # phrases in `caption`, so the class vocabulary actually reaches the model.
  # Same domain vocabulary as OWLv2 and Grounding DINO (prompt parity).
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.1079. The old 0.104 came
  # from the closed-vocabulary <OD> mode.
  # ABLATION (2026-08-04). val 0.1247 -> 0.2340, +0.1094: the largest gain in
  # the whole exercise, and none of it visible one element at a time.
  #
  # Measured alone the three changes were worth +0.0300 (the -large checkpoint
  # over -large-ft), +0.0105 (2x2 tiling) and EXACTLY +0.0000 (adding NMS).
  # Together they are worth +0.1094. NMS does nothing to this model on whole
  # frames because it scores every detection at confidence 1.0, leaving
  # suppression no ranking to work with — and becomes its single largest lever
  # the moment tiling starts producing the same object in several crops.
  #
  # The checkpoint change re-ran the full six-candidate vocabulary search
  # against the new weights, as the equal-effort rule requires. It returned the
  # incumbent vocabulary, so `classes` is unchanged: a null result, recorded.
  - name: florence2
    inferencer: florence2
    model_name: microsoft/Florence-2-large
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    task: "<CAPTION_TO_PHRASE_GROUNDING>"
    caption: "player. ball. referee. rim. number."
    nms_iou_threshold: 0.4
    tiles: [2, 2]
    expected_map5095: 0.238

  # YOLO-World (added 2026-08-01) -- the open-weights gap this comparison had.
  # Open-vocabulary and real-time, but licensed GPL-3.0 (weights) / AGPL-3.0
  # (ultralytics runtime); neither is redistributed here.
  #
  # It runs the GENERIC COCO vocabulary, and that is a measured result, not an
  # oversight: c0_coco_control won its search at val mAP 0.1312 against 0.0445
  # for the same domain vocabulary the other models use. YOLO-World encodes its
  # vocabulary once with CLIP ("prompt-then-detect"), and the compound phrase
  # "basketball player" makes it emit essentially NO people (0 across 5 images,
  # vs 101 for "person") while `basketball hoop` is unchanged. Forcing one
  # shared vocabulary on every model for the look of fairness would have
  # published this row at a third of its real score.
  # ABLATION (2026-08-04). val 0.1318 -> 0.1771, from a per-class vocabulary
  # (+0.0324), imgsz 640 -> 1280 (+0.0134) and a lower box_threshold (+0.0040).
  #
  # This row does NOT tile, and that is a measured decision rather than an
  # omission: 2x2 tiling cost it 0.0529, the worst result in the sweep, because
  # `player` collapsed 0.777 -> 0.450. It is the only model here with a native
  # resolution knob, and raising imgsz does for it what tiling does for the
  # others — without feeding a 640-trained detector crops at a scale its
  # training never saw.
  - name: yolo_world
    inferencer: yolo_world
    model_name: yolov8x-worldv2.pt
    classes:
      - person
      - basketball
      - referee
      - basketball hoop
      - jersey number on a uniform
    box_threshold: 0.001
    nms_iou_threshold: 0.7
    imgsz: 1280
    expected_map5095: 0.189

# SmolVLM2 was removed 2026-07-30. It has no bounding-box grounding head: it was
# prompted for JSON boxes, emitted 1176 detections across the 94 test images all
# labelled `player`, and scored 0.000 AP on every class — the boxes did not land
# on the objects. Reporting it alongside five open-vocabulary DETECTORS invited
# the reading that a detector had been benchmarked and failed, which is not what
# happened. It also carried no reproduction target, so it gated nothing.
