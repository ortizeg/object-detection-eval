# vlm_zeroshot.yaml -- VLM-01/VLM-02 zero-shot VLM run-and-reproduce manifest.
#
# Five zero-shot VLMs, scored over the 94-image basketball test split through
# the identical load_coco_gt -> predict -> remap_detections(merged5) ->
# filters.area_outliers -> filters.single_best_per_class -> compute_metrics
# path as the ONNX detectors in reproduction_640.yaml.
#
# `classes` is each model's own prompt/label vocabulary (index = the raw
# label id passed to remap_detections as that model's label_map). COCO/
# VLM-prompt vocabulary ("person", "sports ball", "basketball hoop", ...) is
# resolved into the merged5 canonical classes via merged5.yaml's `aliases`
# block -- no code edit needed per model. Gemini is prompted directly with the
# canonical class names, so no alias resolution applies to its row.
#
# `tolerance` (0.02 absolute mAP@50:95) is wider than the 7-detector
# reproduction gate's 0.01 (reproduction_640.yaml) -- VLM inference is
# noisier (HF post-processing version drift across transformers releases,
# non-deterministic generation for the two generative models). A divergence
# beyond it is a defect to investigate (prompt/threshold/preprocessing), NOT
# a tolerance to widen.
#
# `expected_map5095` is the published test mAP@50:95 for each row. It stays
# OPTIONAL (null is accepted, VLM-02): a row may run and emit a results file
# without asserting a target. No current row uses that, but the capability is
# retained for adding an exploratory model without gating the reproduction run.

# PROMPT SELECTION (2026-08-01). Each open-weights row's `classes` is no longer
# hand-chosen: it is whichever of the six shared candidates in
# vlm_prompt_search.yaml scored best FOR THAT MODEL on the 96-image VAL split.
# Every model faced the identical candidate set, so "equal tuning effort" is a
# property of the config rather than a claim. The winners differ by model --
# bare canonical names for OmDet-Turbo and Florence-2, domain vocabulary for
# OWLv2 and Grounding-DINO, the generic COCO list for YOLO-World -- which is
# precisely why one shared vocabulary would NOT have been the fair choice.
#
# Gemini is excluded from the search: billed API, and its prompt is a free-text
# instruction rather than a class vocabulary. It keeps its hand-tuned prompt and
# the report says so.

# SINGLETON FILTER (2026-08-03). filters.single_best_per_class now keeps the top
# THREE ball/rim candidates per image rather than the top one. Top-1 was
# discarding correct detections, not duplicates: OWLv2 produced a correct ball
# box in 90.9% of val images but ranked it first in only 51.1%. Every target
# below was measured under top-k=3; they are NOT comparable to numbers published
# before that date.

tolerance: 0.02

models:
  # 2026-10 REFRESH (docs/plans/gemini-refresh-2026-10.md). Model and box
  # format changed; the instruction text is the July prompt plus one sentence
  # naming the coordinate order.
  #
  # MODEL: gemini-3.1-pro-preview -> gemini-3.8-flash. Val mAP@50:95 0.2555 ->
  # 0.3198 (three-draw mean), about 0.06, with gains on every class (`rim` AP50
  # 0.013 -> 0.13-0.18). gemini-3.7-flash ties it (0.3173). 3.8 is published
  # because it is the newest model (`gemini-flash-latest` serves it) and is GA,
  # which also retires the preview-pin risk the August survey flagged.
  # `gemini-pro-latest` still serves 3.1-pro-preview, so there is no newer Pro.
  #
  # BOX FORMAT: box_2d, Google's documented native `[ymin, xmin, ymax, xmax]`
  # array, replacing the named x_min..y_max fields chosen in July. Three draws
  # each on 3.8-flash, val: 0.3282 (sd 0.0007) vs 0.3198 (sd 0.0110). The +0.008
  # on mAP@50:95 is inside the noise and is NOT claimed as a gain. Adopted
  # because two things do separate: `number` AP50 (every box_2d draw 0.33-0.36
  # vs every named-field draw 0.26-0.30) and draw-to-draw spread, 15x tighter.
  # The second matters for a row whose number is one draw of a generative model.
  #
  # Image-first ordering and the cap-free prompt were also tried on both Flash
  # models. Both changed sign between models, i.e. noise, and neither was adopted.
  - name: gemini
    inferencer: gemini
    model_name: gemini-3.8-flash
    gemini_box_format: box_2d
    classes:
      - ball
      - number
      - player
      - referee
      - rim
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      Return each box as box_2d [ymin, xmin, ymax, xmax] normalized to 0-1000.
    # 0.250, not the 0.265 this line carried from Phase 5 until 2026-08-07.
    # `results/vlm/gemini.json` -- the dump every published Gemini number is
    # computed from, and which no later work re-ran -- scores 0.2497. The stale
    # target sat 0.0153 away from it, inside the 0.02 tolerance, so the
    # reproduction gate passed and nothing surfaced the drift. It also spent 77%
    # of the tolerance budget before a run started, which would have masked a
    # real regression and could have failed a legitimate re-run in the other
    # direction. The published report was always correct: it renders from the
    # dump, not from this value.
    #
    # 2026-10: the 0.250 above described the gemini-3.1-pro-preview row. This
    # row is a new configuration. Its single test run (2026-10-12) measured
    # 0.3258 (mAP@50 0.5084 per results/vlm/gemini.json); the target is set from it.
    expected_map5095: 0.326

  # GPT-6 Astra (OpenAI, added 2026-09-25). A NEW model with no prior published
  # number -- expected_map5095 is deliberately null (VLM-02 informational-only
  # mode), not a target to reproduce.
  #
  # SECOND BILLED-API ROW, and treated exactly like Gemini's: a hosted model
  # reached over an API (`gpt-6-astra`), steered by a free-text instruction, not
  # a class-vocabulary detector. So it is EXCLUDED from the equal-effort search
  # (vlm_prompt_search.yaml) for the same two reasons Gemini is -- its input is a
  # free-text prompt, and sweeping it costs money per image -- and instead gets a
  # DISCLOSED, bespoke, hand-tuned prompt. No torch/GPU: pure API call (see
  # inference/vlm/astra.py). reasoning_effort is Astra's accuracy/cost lever
  # (low/medium/high/xhigh/max), stated on the row so the published effort is
  # explicit.
  #
  # PROMPT + EFFORT EXPLORATION (2026-09-25, on the rented API runner, val split,
  # scripts/explore_astra_prompts.py; full results in
  # results/vlm/prompt_search/astra_explore.json). SIX hand-written candidates at
  # low effort, full 96-image val:
  #   c_gemini_style            0.4850  (winner) rim 0.62
  #   c_bare_canonical          0.4617           rim 0.50
  #   c_reasoning_exclusion     0.4610           rim 0.00
  #   c_small_object_reasoning  0.4585           rim 0.00
  #   c_small_object            0.4476           rim 0.00
  #   c_domain                  0.4422           rim 0.00
  # The single load-bearing lesson: Astra needs the LITERAL label "rim" -- every
  # candidate phrasing it as "basketball hoop..." collapsed rim to EXACTLY 0.000,
  # the opposite of what "name the structure" did for OWLv2/Qwen3-VL. The winning
  # prompt is the same per-class-definition + count-cap instruction Gemini's row
  # uses, on canonical labels.
  #
  # EFFORT A/B (2026-09-25, val, winning prompt): low 0.4850 vs medium 0.4844 --
  # a tie on mAP@50:95 (medium is +0.008 on mAP@50 / +0.02 rim but fractionally
  # LOWER on the headline metric), at ~2x the cost and latency. LOW is published:
  # same accuracy, half the spend -- consistent with the "high barely helps"
  # finding in OpenAI/Roboflow's own Astra evals. (high/xhigh/max were out of
  # scope by decision; low+medium only.)
  #
  # See results/vlm/astra.json for the committed test prediction dump the
  # published test number is computed from.
  - name: astra
    inferencer: astra
    model_name: gpt-6-astra
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    reasoning_effort: low
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      Return each box as (x_min, y_min, x_max, y_max) integers in a 0-1000
      normalised coordinate system and a confidence in [0, 1].
    expected_map5095: null

  # BLOG-PARITY ROWS (added 2026-10-14). The Ultralytics Platform
  # auto-annotation benchmark (36 datasets, class-prompted, "every provider at
  # its default reasoning effort") published GPT-6.1 Sol 0.491, Claude Opus 5.5
  # 0.476 and GPT-6 Astra 0.470 mAP50. The rows below put the models it ranked
  # that this table lacked onto our split, under our protocol. (Gemini 4 Argon
  # is handled on the gemini-refresh branch.)
  #
  # They run at `reasoning_effort: default` (the parameter is omitted), matching
  # that benchmark's setting (sol_low adds a matched-effort check). All reuse the Astra row's
  # winning prompt verbatim except for the coordinate sentence: there was no
  # per-model prompt search, so these are untuned rows and the report must say
  # so. New models, no prior number: expected_map5095 is null.
  #
  # Sol is an OpenAI model on the same chat-completions + structured-output
  # surface as Astra, so it reuses the Astra inferencer unchanged.
  - name: sol
    inferencer: astra
    model_name: gpt-6.1-sol
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    reasoning_effort: default
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      Return each box as (x_min, y_min, x_max, y_max) integers in a 0-1000
      normalised coordinate system and a confidence in [0, 1].
    expected_map5095: null

  # Sol at `low`: matched effort with the published `astra` row (same OpenAI
  # effort scale), so Sol vs Astra can be read at equal effort as well as at
  # the provider default. Identical prompt to `sol`; only the effort differs.
  - name: sol_low
    inferencer: astra
    model_name: gpt-6.1-sol
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    reasoning_effort: low
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      Return each box as (x_min, y_min, x_max, y_max) integers in a 0-1000
      normalised coordinate system and a confidence in [0, 1].
    expected_map5095: null

  # Astra at the provider-default effort: the blog's setting, so the three
  # OpenAI/Anthropic rows compare like for like. A PARITY row, not a replacement:
  # the published `astra` row stays at `low`, chosen on val (it tied medium at
  # half the cost). Identical prompt to `astra`; only the effort differs.
  - name: astra_default
    inferencer: astra
    model_name: gpt-6-astra
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    reasoning_effort: default
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      Return each box as (x_min, y_min, x_max, y_max) integers in a 0-1000
      normalised coordinate system and a confidence in [0, 1].
    expected_map5095: null

  # Claude Opus 5.5 answers in the PIXEL grid of the image it receives, not a
  # 0-1000 frame (see inference/vlm/claude.py). The inferencer downscales each
  # frame to a 1568 px long edge itself and fills {width}/{height} below, so the
  # coordinate sentence is the only change from the Astra/Sol prompt. No refusal
  # fallback model is configured: every box in this row is from Opus 5.5.
  - name: claude_opus
    inferencer: claude
    model_name: claude-opus-5-5
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    reasoning_effort: default
    prompt_template: >
      Detect all basketball players, referees, the rim, the basketball, and
      visible jersey numbers in this basketball game image.
      Constraints:
      - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
      - Each person gets exactly ONE bounding box with the most specific label.
      Use EXACTLY these labels:
      - "player" for any basketball player on the court
      - "referee" for game officials
      - "ball" for the basketball (only when NOT going through the rim)
      - "rim" for the basketball hoop rim
      - "number" for visible jersey numbers (tight box around the digits only)
      The image is {width} pixels wide and {height} pixels tall. Return each box
      as (x_min, y_min, x_max, y_max) integer pixel coordinates in this image
      (0,0 = top-left) and a confidence in [0, 1].
    expected_map5095: null

  # ABLATION (2026-08-04). 2x2 overlapping tiles plus the full frame, and NMS
  # re-tuned INSIDE that regime. val 0.2400 -> 0.2879.
  #
  # The NMS value is the whole lesson of this row. Swept on whole frames, this
  # model's optimum was IoU 1.0 — no suppression at all, worth +0.0075, because
  # at 0.3 NMS was deleting genuinely distinct overlapping players rather than
  # duplicates. Carried into the tiled configuration unchanged it scored 0.2424,
  # WORSE than tiling alone at 0.2831, because tiling runs five overlapping
  # crops and manufactures the duplicates "suppress nothing" was chosen to keep.
  # Re-swept under tiling the optimum is 0.5.
  - name: owlv2
    inferencer: owlv2
    model_name: google/owlv2-large-patch14-ensemble
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.01
    nms_iou_threshold: 0.5
    tiles: [2, 2]
    expected_map5095: 0.315

  # PROMPT EQUALISED (2026-08-01). This row ran the generic COCO list while
  # OWLv2/Grounding-DINO/Florence-2 had domain vocabulary -- the last known
  # fairness gap in this table. It now uses whichever of the SIX shared
  # candidates in vlm_prompt_search.yaml scored best for it on the VAL split:
  # c5_bare_canonical (val mAP 0.1804, vs 0.1705 for the COCO list it replaces).
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.1796. The pre-2026-08-01
  # 0.173 was measured with the generic COCO list and described a different
  # configuration entirely.
  # ABLATION (2026-08-04). val 0.1806 -> 0.2159, from tiling (+0.0259) and a
  # per-class vocabulary (+0.0060). Every other knob was inside noise — this was
  # the model nothing helped until tiling.
  #
  # processor_nms_threshold is now stated. It was never passed before, so it sat
  # at the transformers default while the manifest documented the OUTER NMS as
  # this model's setting; the inner pass runs first and on the full candidate
  # set, which is why the outer one measured as a no-op above 0.5.
  - name: omdet_turbo
    inferencer: omdet_turbo
    model_name: omlab/omdet-turbo-swin-tiny-hf
    classes:
      - basketball player
      - basketball
      - referee
      - rim
      - number
    box_threshold: 0.01
    nms_iou_threshold: 0.5
    processor_nms_threshold: 0.5
    tiles: [2, 2]
    expected_map5095: 0.211

  # PROMPT PARITY (2026-07-30): given the same domain-specific vocabulary
  # OWLv2 already had. Previously it received a generic COCO list while Gemini
  # got a hand-tuned prompt, so the comparison measured prompt effort as much as
  # model capability -- the same unfairness the detector report refuses to
  # tolerate for training recipes.
  #
  # text_threshold 0.01 -> 0.25 (Grounding DINO's published default). At 0.01
  # nearly every text token activated, the returned label spanned the whole
  # caption, and label resolution collapsed: 533 detections/image, 99.7%
  # `person`, and the ball found ONCE in 94 images.
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.2338. The previously
  # published 0.147 came from the broken configuration. The repair is dramatic
  # and worth recording: detections fell from 533/image to ~15, the dump shrank
  # 10.5 MB -> 260 KB, `ball` went 0.000 -> 0.319 and `referee` 0.000 -> 0.237.
  # This row went from looking like the second-worst model in the table to the
  # second-best open-weights one, 0.012 behind OWLv2.
  - name: grounding_dino
    inferencer: grounding_dino
    model_name: IDEA-Research/grounding-dino-base
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.01
    text_threshold: 0.25
    # ABLATION (2026-08-04): 2x2 tiling, +0.0332 on val, almost all of it
    # `referee` (0.239 -> 0.445). NMS re-tuned under tiling: 0.5 -> 0.7.
    nms_iou_threshold: 0.7
    tiles: [2, 2]
    expected_map5095: 0.293

  # TASK TOKEN FIXED (2026-07-30). This ran with `<OD>` -- Florence-2's CLOSED
  # -vocabulary mode, which can only emit its own pretrained label set and
  # cannot be steered by `classes` at all. The result was 923 of 924 detections
  # labelled `person` and 0.000 AP on three of five classes: a measurement of
  # the wrong operating mode, not of the model.
  #
  # `<CAPTION_TO_PHRASE_GROUNDING>` is the open-vocabulary path: it grounds the
  # phrases in `caption`, so the class vocabulary actually reaches the model.
  # Same domain vocabulary as OWLv2 and Grounding DINO (prompt parity).
  #
  # Target from the 2026-08-03 CUDA (RTX A4000) run: 0.1079. The old 0.104 came
  # from the closed-vocabulary <OD> mode.
  # ABLATION (2026-08-04). val 0.1247 -> 0.2340, +0.1094: the largest gain in
  # the whole exercise, and none of it visible one element at a time.
  #
  # Measured alone the three changes were worth +0.0300 (the -large checkpoint
  # over -large-ft), +0.0105 (2x2 tiling) and EXACTLY +0.0000 (adding NMS).
  # Together they are worth +0.1094. NMS does nothing to this model on whole
  # frames because it scores every detection at confidence 1.0, leaving
  # suppression no ranking to work with — and becomes its single largest lever
  # the moment tiling starts producing the same object in several crops.
  #
  # The checkpoint change re-ran the full six-candidate vocabulary search
  # against the new weights, as the equal-effort rule requires. It returned the
  # incumbent vocabulary, so `classes` is unchanged: a null result, recorded.
  - name: florence2
    inferencer: florence2
    model_name: microsoft/Florence-2-large
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    task: "<CAPTION_TO_PHRASE_GROUNDING>"
    caption: "player. ball. referee. rim. number."
    nms_iou_threshold: 0.4
    tiles: [2, 2]
    expected_map5095: 0.238

  # YOLO-World (added 2026-08-01) -- the open-weights gap this comparison had.
  # Open-vocabulary and real-time, but licensed GPL-3.0 (weights) / AGPL-3.0
  # (ultralytics runtime); neither is redistributed here.
  #
  # It runs the GENERIC COCO vocabulary, and that is a measured result, not an
  # oversight: c0_coco_control won its search at val mAP 0.1312 against 0.0445
  # for the same domain vocabulary the other models use. YOLO-World encodes its
  # vocabulary once with CLIP ("prompt-then-detect"), and the compound phrase
  # "basketball player" makes it emit essentially NO people (0 across 5 images,
  # vs 101 for "person") while `basketball hoop` is unchanged. Forcing one
  # shared vocabulary on every model for the look of fairness would have
  # published this row at a third of its real score.
  # ABLATION (2026-08-04). val 0.1318 -> 0.1771, from a per-class vocabulary
  # (+0.0324), imgsz 640 -> 1280 (+0.0134) and a lower box_threshold (+0.0040).
  #
  # This row does NOT tile, and that is a measured decision rather than an
  # omission: 2x2 tiling cost it 0.0529, the worst result in the sweep, because
  # `player` collapsed 0.777 -> 0.450. It is the only model here with a native
  # resolution knob, and raising imgsz does for it what tiling does for the
  # others — without feeding a 640-trained detector crops at a scale its
  # training never saw.
  #
  # REFEREE-WORD INVESTIGATION (2026-08-19, targeted, NOT equal-effort). Pulled
  # from the six committed rows' per-class AP50: YOLO-World is the ONLY model
  # with a complete `referee` collapse (0.000) — every other model, including
  # the four other phrase-grounding detectors scoring the identical bare word
  # "referee", gets 0.37-0.72. That rules out "referee is a bad word" as the
  # explanation on its own, so this was a further, single-class, DISCLOSED
  # follow-up (more tuning attention than the equal-effort process gives every
  # model — see vlm_prompt_search.yaml's header), not a repeat of it.
  #
  # Sanity check first (10 val images, 30 GT referee boxes, box_threshold
  # dropped to 0.0001 so nothing was threshold-filtered before looking): every
  # single GT referee box had an overlapping raw detection at IoU 0.61-0.98,
  # often at high confidence (up to 0.91) — and EVERY one of them was labelled
  # `person`, never `referee`. So this is not a missing-box or a
  # threshold/NMS-filtering problem; it is a labelling collision inside the
  # model's own argmax over its CLIP-encoded vocabulary.
  #
  # That predicts a vocabulary swap should be able to fix it. It didn't. Five
  # candidate referee-class words were swept on val (person/basketball/
  # basketball hoop/jersey number on a uniform held fixed at the values below;
  # `vlm_ablation.yaml`'s `referee_word` element, reproducible via
  # `ablate_vlm.py --only yolo_world --element referee_word --split valid`):
  #
  #     word                          referee AP50   overall val mAP@50:95
  #     referee (current, published)  0.000          0.1771
  #     official                      0.000          0.1846
  #     basketball official           0.000          0.1828
  #     black and white striped shirt 0.000          0.1811
  #     man in a striped shirt        0.000          0.1779
  #     umpire                        0.000          0.1777
  #
  # `referee` AP50 is EXACTLY 0.000 for every candidate, including the four
  # that never previously touched the word "referee" at all (official, umpire,
  # basketball official, black and white striped shirt) — the same outcome
  # ELEMENT 8 of vlm_ablation.yaml already recorded for "referee in a striped
  # shirt". Combined with the sanity check, this is not a wording problem:
  # `person` wins the argmax over every referee phrasing tried, which reads as
  # a genuine CLIP-encoder blind spot for this checkpoint rather than a missing
  # prompt.
  #
  # `official`'s higher OVERALL mAP (0.1846 vs 0.1771) is real but NOT a
  # referee fix — it comes entirely from `number` (AP50 0.051 -> 0.113, a
  # vocabulary-context side effect on an unrelated class, the same
  # neighbouring-word sensitivity the COCO-control paragraph above documents),
  # with `referee` unchanged at 0.000. Adopting it under this investigation's
  # banner would misrepresent a `number`-class coincidence as a referee result,
  # so it is disclosed here and NOT adopted; the published vocabulary is
  # unchanged. A `number`-class win would need its own targeted investigation
  # to be trusted, not a byproduct of a referee sweep.
  #
  # NET RESULT: negative. The published vocabulary is unchanged; test was not
  # re-run (the config did not change).
  - name: yolo_world
    inferencer: yolo_world
    model_name: yolov8x-worldv2.pt
    classes:
      - person
      - basketball
      - referee
      - basketball hoop
      - jersey number on a uniform
    box_threshold: 0.001
    nms_iou_threshold: 0.7
    imgsz: 1280
    expected_map5095: 0.189

  # YOLOE-26x (added 2026-10-11, docs/plans/yoloe-zeroshot.md). YOLO-World's
  # successor on the same ultralytics runtime, with a MobileCLIP2 text encoder
  # and a RepRTA head. Same licence posture as yolo_world above: AGPL runtime
  # in the optional extra, weights downloaded at runtime, never vendored.
  #
  # EQUAL-EFFORT ROW. Every choice below was made on val, through the same
  # process every open-weights row got:
  #   1. Six-candidate prompt search (results/vlm/prompt_search/yoloe.json):
  #      c2_contrastive won at 0.2014. It is also the first real-time row to
  #      detect referees at all (AP50 0.43 vs YOLO-World's 0.000).
  #   2. One-knob ablation (vlm_ablation.yaml, `yoloe__*` arms): imgsz 1280
  #      +0.0218, the only single knob above the 0.002 floor. Smaller and
  #      older checkpoints (26l, 11l, v8l) all lose 0.036-0.050.
  #   3. Stacked on 1280: the six candidates re-scored (c4 wins), box 0.001
  #      +0.0082, the per-class composition (c4 + bare `number`) +0.0125,
  #      then NMS 0.8 +0.0051. Val 0.2512.
  #   4. Class-aware NMS (Round 6, 2026-10-12) +0.0095, all of it `player`.
  #      `YOLOE.predict` forces class-agnostic NMS on every call; every other
  #      row suppresses per class. Missed in Round 3 because ultralytics resets
  #      the override inside `predict`. IoU re-swept under it: 0.8 holds.
  #      Val 0.2607.
  #
  # SECOND TEST LOOK, disclosed. The row was first run on test on 2026-10-11
  # without step 4: mAP@50:95 0.2761, mAP@50 0.3811. Step 4 was found and
  # adopted on val only, then test was run once more for the corrected config.
  #
  # `rim` stays at exactly 0.000 under every arm. The hoop class lands on the
  # backboard. In 82 of 96 val frames the box closest to the GT rim is an
  # `orange basketball` box: YOLOE sees the orange ring as the ball. Crop-
  # refining around hoop boxes or around ball boxes (Round 6) did not move it.
  - name: yoloe
    inferencer: yoloe
    model_name: yoloe-26x-seg.pt
    classes:
      - basketball player in a team uniform
      - orange basketball
      - referee in a striped shirt
      - basketball hoop and backboard
      - number
    box_threshold: 0.001
    nms_iou_threshold: 0.8
    agnostic_nms: false
    imgsz: 1280
    max_det: 300
    # TEST (2026-10-12, MPS, second look, see above): mAP@50:95 0.2777. The
    # +0.0095 val gain from class-aware NMS shrank to +0.0016 on test.
    expected_map5095: 0.278

  # YOLOE-26x + NUMBER CROP. DISCLOSED PIPELINE VARIANT, the open-weights
  # analogue of Astra's per-player number crop. The `yoloe` config above, plus
  # a second pass: crop each `player` box (conf >= 0.1, +10%), re-detect
  # `number` inside it with a second YOLOE prompted for `number` alone at
  # 640 px, and merge with the full-frame numbers by per-class NMS 0.5. Still
  # one model, still zero-shot. Val 0.2805 (+0.0198 over `yoloe`), all of it
  # `number` (AP50 0.233 -> 0.535). Prompting the refiner with `jersey number`
  # instead gave 0.2618. A second full-frame pass at 1920 px for `number` alone
  # (scratch, not in the ablation log) reached only 0.412 `number` AP50.
  - name: yoloe_number_crop
    inferencer: yoloe
    model_name: yoloe-26x-seg.pt
    classes:
      - basketball player in a team uniform
      - orange basketball
      - referee in a striped shirt
      - basketball hoop and backboard
      - number
    box_threshold: 0.001
    nms_iou_threshold: 0.8
    agnostic_nms: false
    imgsz: 1280
    max_det: 300
    anchor_crop:
      anchor: basketball player in a team uniform
      target: number
      refiner_classes: [number]
    # TEST (2026-10-12, MPS, run once): mAP@50:95 0.3109, +0.033 over `yoloe`.
    expected_map5095: 0.311

  # YOLOE-26x + PROMPT ENSEMBLING + NUMBER CROP. DISCLOSED EXTRA EFFORT, the
  # most work any YOLOE configuration got. `yoloe_number_crop`, plus four of
  # the five classes prompted with the mean MobileCLIP embedding of several
  # phrases instead of one. Some phrases come from the shared pool and some
  # were hand-written (athlete in a jersey, leather basketball, basketball
  # official, referee in a black and white striped shirt). The label stays the
  # class string, so scoring is unchanged. On the class-aware stack the
  # ensemble alone scores val 0.2779 (referee AP50 0.456 -> 0.597), and with
  # the number crop 0.2999. The two help different classes, so they add up.
  # Replaces the 2026-10-11 `yoloe_ensemble` row (agnostic NMS, no crop; test
  # 0.2912), which was superseded on val before this row reached test.
  - name: yoloe_ensemble_number_crop
    inferencer: yoloe
    model_name: yoloe-26x-seg.pt
    classes:
      - basketball player in a team uniform
      - orange basketball
      - referee in a striped shirt
      - basketball hoop and backboard
      - number
    prompt_ensembles:
      basketball player in a team uniform:
        [basketball player in a team uniform, basketball player, player, athlete in a jersey]
      orange basketball: [orange basketball, basketball, ball, sports ball, leather basketball]
      referee in a striped shirt:
        [referee in a striped shirt, referee, basketball official,
         referee in a black and white striped shirt]
      basketball hoop and backboard: [basketball hoop and backboard, basketball hoop, rim]
    box_threshold: 0.001
    nms_iou_threshold: 0.8
    agnostic_nms: false
    imgsz: 1280
    max_det: 300
    anchor_crop:
      anchor: basketball player in a team uniform
      target: number
      refiner_classes: [number]
    # TEST (2026-10-12, MPS, run once): mAP@50:95 0.3315, +0.054 over `yoloe`.
    expected_map5095: 0.332

  # YOLOE-26x + PROMPT ENSEMBLING + NUMBER CROP + BOX CALIBRATION. DISCLOSED,
  # and the one row here with a correction fitted on labelled val boxes.
  # YOLOE's boxes sit inside the annotators' on every class (median edge offset
  # about -2 to -3.5% of the box per side for people and ball, -6 to -8% for
  # `number`, the same at 640 px). `box_pad` grows each published box about its
  # centre, per side: 2% for player/ball/referee/rim, 8% for `number`. Chosen
  # on val from a 7-value grid (vlm_ablation.yaml `box_pad_on_ensemble_crop`):
  # 0.2999 -> 0.3507. On the equal-effort stack the same values give 0.2607 ->
  # 0.2891. No other row was offered this knob, so it says nothing about the
  # other models' boxes.
  - name: yoloe_ensemble_number_crop_box_pad
    inferencer: yoloe
    model_name: yoloe-26x-seg.pt
    classes:
      - basketball player in a team uniform
      - orange basketball
      - referee in a striped shirt
      - basketball hoop and backboard
      - number
    prompt_ensembles:
      basketball player in a team uniform:
        [basketball player in a team uniform, basketball player, player, athlete in a jersey]
      orange basketball: [orange basketball, basketball, ball, sports ball, leather basketball]
      referee in a striped shirt:
        [referee in a striped shirt, referee, basketball official,
         referee in a black and white striped shirt]
      basketball hoop and backboard: [basketball hoop and backboard, basketball hoop, rim]
    box_threshold: 0.001
    nms_iou_threshold: 0.8
    agnostic_nms: false
    imgsz: 1280
    max_det: 300
    anchor_crop:
      anchor: basketball player in a team uniform
      target: number
      refiner_classes: [number]
    box_pad: {player: 0.02, ball: 0.02, referee: 0.02, rim: 0.02, number: 0.08}
    # TEST (2026-10-15, MPS, run once): mAP@50:95 0.3749, +0.043 over
    # `yoloe_ensemble_number_crop` (0.3315).
    expected_map5095: 0.375

  # LLMDet-large (added 2026-08-17) -- the seventh row. Architecturally
  # mm-grounding-dino: same HF calling convention as Grounding DINO
  # (AutoModelForZeroShotObjectDetection + post_process_grounded_object_detection),
  # confirmed via its own model card ("inference is identical to Grounding
  # DINO's") and its HF config (model_type "mm-grounding-dino"). Apache-2.0.
  #
  # Needs transformers>=4.55.0, unavailable on the `vlm` extra's <4.52.0 pin
  # (guards HF post-processing drift the other six rows' gate is sensitive
  # to) -- runs in its own isolated `llmdet` pixi extra instead of bumping
  # that shared pin. See inference/vlm/llmdet.py and pyproject.toml's
  # `llmdet` extra for the isolation rationale.
  #
  # PROMPT SEARCH (2026-08-17, RTX 4090). Six-candidate search on val:
  # c5_bare_canonical (bare class names) won at 0.3369, ahead of c1_domain's
  # 0.2958 and c0_coco_control's 0.2418 -- the two "add descriptive words"
  # candidates (c2/c4, contrastive phrasing) both collapsed player and
  # referee to 0.000, the same fragile-prompt failure mode YOLO-World's row
  # documents for compound phrases. Full results:
  # results/vlm/prompt_search/llmdet.json.
  #
  # TILING (2026-08-17, val, same box). 2x2 overlapping tiles: 0.3369 ->
  # 0.3589 (+0.0220), and the first configuration in this file to get `rim`
  # off exactly 0.000 (0.0238) -- `number` also jumped 0.4717 -> 0.6741.
  # Adopted.
  #
  # NMS RE-SWEPT UNDER TILING (2026-08-20, val, RTX 4090). Unlike
  # Grounding-DINO (0.5 -> 0.7, +0.0332, "almost all of it referee") or
  # OWLv2, tiling did NOT manufacture a cross-tile-duplicate problem worth
  # correcting here: {0.2, 0.3, 0.5, 0.7, 0.9, 1.0} scores 0.3567/0.3596/
  # 0.3590/0.3583/0.3522/0.2716 -- flat across 0.2-0.7 (a 0.0028 span, inside
  # measurement noise) and only degrading sharply once suppression is
  # disabled entirely at 1.0. The nominal optimum (0.3, 0.3596) beats the
  # untiled starting value (0.5, 0.3590) by +0.0006 -- not a real signal.
  # nms_iou_threshold KEPT at 0.5: results/vlm/prompt_search/llmdet_nms_sweep.json.
  #
  # SENTENCE-STYLE PROMPT EXPLORATION (2026-08-20, val, RTX 4090).
  # EXPLICITLY NOT equal-effort -- four hand-written candidates outside the
  # shared 6-candidate pool in vlm_prompt_search.yaml, tried because LLMDet
  # is trained under LLM-generated CAPTION supervision and might respond
  # better to descriptive sentences than bare category words. It doesn't:
  # article-prefixed bare words ("a player", "a referee", ...) scored 0.2793,
  # below the adopted vocabulary's 0.3589, and three genuinely sentence-style
  # candidates (short declarative / long descriptive caption / scene-context,
  # all multi-clause) collapsed to exactly 0.0000 on every class -- LLMDet's
  # phrase-grounding head (same family as Grounding DINO, built to align
  # short noun phrases to boxes) could not resolve a coherent span for a
  # multi-clause sentence and emitted empty labels almost every time. A
  # phrase-grounding architecture limit, not a generic "sentences don't help
  # VLMs" finding. classes kept unchanged (c5_bare_canonical):
  # results/vlm/prompt_search/llmdet_sentence_prompts.json.
  #
  # TEST-SPLIT RESULT (2026-08-18, RTX 4090, run once via
  # `run_vlm_benchmark.py --only llmdet`): mAP@50:95 0.3883, mAP@50 0.5062 --
  # the strongest single zero-shot row in this comparison, ahead of every
  # other model's individually reported test mAP@50:95. Neither follow-up
  # experiment above beat the config this number was measured under, so it
  # was not re-run.
  #
  # No expected_map5095: a new model has no prior published number to
  # reproduce against (VLM-02's informational-only mode). See
  # results/vlm/llmdet.json for the committed prediction dump the 0.3883
  # figure above is computed from.
  - name: llmdet
    inferencer: llmdet
    model_name: iSEE-Laboratory/llmdet_large
    classes:
      - player
      - ball
      - referee
      - rim
      - number
    box_threshold: 0.01
    text_threshold: 0.25
    nms_iou_threshold: 0.5
    tiles: [2, 2]
    expected_map5095: 0.439
  # Qwen3-VL-8B (added 2026-08-17). Apache-2.0. A NEW model with no prior
  # published number -- expected_map5095 is deliberately null (VLM-02
  # informational-only mode), not a target to reproduce.
  #
  # HYBRID ROW, documented so it is not misfiled as either precedent it
  # resembles. The CODE is Gemini-shaped: no HF detection processor exists for
  # a generative model, so `Qwen3VLInferencer` does a chat `generate()` call
  # and parses a JSON text response (`{"bbox_2d": [x1,y1,x2,y2], "label":
  # ...}` in 0-1000 normalised coordinates -- confirmed from the official
  # QwenLM/Qwen3-VL cookbook's `2d_grounding.ipynb`, not guessed). But the
  # PROTOCOL TREATMENT is a detector's, not Gemini's: `classes` below drives a
  # MECHANICALLY built prompt, not hand-tuned free text, so this row goes
  # through the same equal-effort vocabulary search
  # (`vlm_prompt_search.yaml`) the open-weights detectors face -- it is not
  # exempted the way Gemini's billed, hand-tuned prompt is.
  #
  # PROMPT SEARCH (2026-08-18, on the rented RTX 4090). All six candidates
  # from vlm_prompt_search.yaml, val mAP@50:95: c0_coco_control 0.0745,
  # c1_domain 0.1592, c2_contrastive 0.1483, c3_small_object 0.1861 (winner),
  # c4_contrastive_small_object 0.1699, c5_bare_canonical 0.1189. Same "name
  # colour/structure" pattern seen elsewhere in this table (OWLv2,
  # Grounding-DINO): naming the ball's colour and the rim's structure carries
  # signal a general model's prior can use.
  #
  # TILING (2026-08-18). Measured on a 24-image val subsample (not the full 96
  # -- Qwen3-VL is ~45-90s/image, generative, unlike the sub-second HF
  # detectors the original full-split tiling ablation was built around; five
  # forward passes/image over 96 images would cost several GPU-hours for one
  # secondary check). 2x2 + full frame, merge NMS 0.5: mAP@50:95 0.1939 (this
  # subsample's untiled score) -> 0.1157, a clear regression (-0.0782). This
  # row does NOT tile -- a measured decision, not an omission, in the same
  # spirit as YOLO-World's (which tiling also hurt, -0.0529). Consistent with
  # the crowd-mislabeling weakness found during the decision-gate sanity
  # check: this model already over-labels bench/spectator regions as
  # `player` on busy frames, and tiling multiplies how many crops it sees a
  # crowd in, compounding rather than fixing that.
  #
  # RESOLUTION (2026-08-19). A standard inference hyperparameter, the same
  # tier as YOLO-World's `imgsz` -- NOT a vocabulary/prompt change, so it does
  # not need equal-effort disclosure. Qwen3-VL's image processor resizes to
  # fit a total-pixel budget (`processor.image_processor.size`); the
  # checkpoint's own default bounds (roughly 256x256 to 4096x4096) already
  # comfortably contain this dataset's native 1920x1080 frames, so nothing
  # was being silently downscaled. But forcing genuine UPSCALING (setting
  # `shortest_edge` above native resolution) measurably helped: visually
  # confirmed first (native-resolution runs emit ~40-60 "jersey number"
  # detections per image of which only ~1 renders as a real, distinct,
  # correctly-placed box -- the rest are near-duplicate/degenerate noise;
  # forcing 2x upscaling collapses that flood to a handful of detections that
  # are ALL correctly placed on real jersey numbers), then measured on the
  # same 24-image val subsample the tiling check used: mAP@50:95 0.1939
  # (native) -> 0.2624 (2x upscale, shortest_edge=4096000/longest_edge=
  # 8192000), **+0.0685**. `number` AP50 alone: ~0 -> 0.278. `rim` stays at
  # 0.000 either way -- resolution is not what is wrong with `rim` (see the
  # search table above; that class collapses in every row in this
  # comparison, not just this one). `Qwen3VLInferencer`'s `min_pixels`/
  # `max_pixels` now DEFAULT to this 2x floor (not `None`, which would
  # reproduce the checkpoint's own bounds) -- pass `None` explicitly for an
  # A/B comparison against the checkpoint default.
  #
  # TILING RE-CHECKED under 2x upscaling (2026-08-19, reasoned, not
  # re-measured): tiling's -0.0782 regression traced to crowd-mislabeling
  # (five overlapping crops multiplying how often the model sees, and
  # mislabels, bench/spectator regions as `player`) -- a vocabulary/labelling
  # failure mode, not a resolution one. Forcing upscaling does not touch
  # that mechanism, so the untiled decision is expected to still hold. Not
  # re-run given the 24-image tiled arm alone costs ~90 GPU-minutes.
  #
  # PROMPT-CONSTRAINT EXPERIMENT (2026-08-19) -- DISCLOSED, NON-EQUAL-EFFORT.
  # Unlike the vocabulary search above, this is a BESPOKE exploration, same
  # posture as Gemini's hand-tuned row: not drawn from the shared 6-candidate
  # vlm_prompt_search.yaml pool, and stated so explicitly here.
  #
  # The decision-gate sanity check found this model boxes bench/spectator
  # regions as `player` on crowded frames. Tried fixing it directly: three
  # candidate prompts, each adding explicit court-only / spectator-exclusion
  # constraint language to the mechanical template (mirroring Gemini's own
  # "At most N players... Each person gets exactly ONE bounding box"
  # constraint style), scored on the same 24-image val subsample as the
  # resolution and tiling checks, at 2x upscale resolution:
  #   baseline (mechanical prompt)              0.2624
  #   c_court_only   (exclude non-court people)  0.2599  (-0.0025)
  #   c_numeric_cap  (+ explicit count caps)      0.2601  (-0.0023)
  #   c_uniform_cue  (uniform-based cue)          0.2551  (-0.0073)
  # All three land at or slightly below baseline, inside this experiment's
  # noise band. NEGATIVE RESULT: explicit constraint language does not fix
  # the crowd-mislabeling weakness -- the model already "knows" what a
  # player looks like well enough that telling it to exclude spectators adds
  # instruction-following overhead without adding discriminating signal.
  # `prompt_template` is NOT set on this row; the mechanical prompt stands.
  #
  # ENVIRONMENT: requires transformers>=4.57.0, newer than the <4.52.0 ceiling
  # the other six rows share. Run this row under `pixi run -e vlm-qwen3vl`,
  # NOT `-e vlm` -- see pixi.toml's `[feature.qwen3vl]` comment. On a rented
  # CUDA box, `vlm-qwen3vl-cuda` additionally needs `cuda-compiler` (see
  # `[feature.vlmcuda]`'s comment) -- Qwen3-VL JIT-compiles a Triton kernel
  # for its rotary-embedding path at `generate()` time, and without it that
  # compile fails silently, indistinguishable from the model finding nothing.
  - name: qwen3_vl
    inferencer: qwen3_vl
    model_name: Qwen/Qwen3-VL-8B-Instruct
    classes:
      - basketball player
      - orange basketball
      - referee
      - basketball hoop and backboard
      - jersey number on a uniform
    expected_map5095: null

# SmolVLM2 was removed 2026-07-30. It has no bounding-box grounding head: it was
# prompted for JSON boxes, emitted 1176 detections across the 94 test images all
# labelled `player`, and scored 0.000 AP on every class — the boxes did not land
# on the objects. Reporting it alongside five open-vocabulary DETECTORS invited
# the reading that a detector had been benchmarked and failed, which is not what
# happened. It also carried no reproduction target, so it gated nothing.

  # DINO-X Pro (IDEA Research, added 2026-10-11). Plan of record and every val
  # arm: docs/plans/dinox-pro-2026-10.md, results/vlm/prompt_search/
  # dinox_explore.json. `DINO-X-1.0` is DINO-X Pro's id on DeepDataSpace's V2
  # API; there are no open weights. Torch-free: inference/vlm/dinox.py speaks
  # the REST API over httpx (the vendor SDK is avoided -- it ships the API token
  # to a third-party Sentry host).
  #
  # BILLED, BUT A CLASS-VOCABULARY DETECTOR -- so unlike Gemini/Astra it is NOT
  # exempt from the equal-effort search. It faced the same six shared
  # candidates on val, untiled (server bbox_threshold 0.01, server NMS 0.8):
  #   c1_domain                    0.3420  (winner)
  #   c5_bare_canonical            0.3362
  #   c3_small_object              0.3105
  #   c2_contrastive               0.2902
  #   c4_contrastive_small_object  0.2382
  #   c0_coco_control              0.2268
  # then the same ablation levers the open rows got:
  #   local NMS 0.5/0.6/0.7        <= 0.3417  reverted (server NMS suffices)
  #   2x2 tiling, merge NMS 0.5    0.4294     KEPT (+0.087; merge NMS swept
  #                                           0.3-0.7, peak at 0.5)
  #   downscale to 1536            0.3390     reverted
  # Refetching the winner with the cache bypassed scored 0.3419 vs 0.3420: the
  # API is effectively deterministic, so the 0.005 floor of the adoption rule
  # applies.
  #
  # `rim` is ~0 for every vocabulary containing "basketball hoop": GT boxes the
  # RING only, DINO-X's hoop box includes the net (median best IoU 0.41, area
  # 2.1x GT). This is the headline row's definition mismatch, not a bug.
  - name: dinox_pro
    inferencer: dinox
    model_name: DINO-X-1.0
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.01
    dinox_iou_threshold: 0.8
    nms_iou_threshold: 0.5
    tiles: [2, 2]
    # 0.4393 from the single 2026-10-12 test run (results/vlm/dinox_pro.json).
    expected_map5095: 0.439
