# --------------------------------------------------------------------------- #
# Round 2 report structure. Everything below names rows; no number is typed here.
# A "ref" is a group key, a row id (`<model key>/<arm folder>`), or a reference
# detector name (YOLO26m, DEIM-M: the published 640 px predictions).
# --------------------------------------------------------------------------- #

# Seed groups: the bootstrap scores a group as the per-draw mean of its members, so a
# group's clustered CI is the CI of the seed-averaged model.
groups:
  - {key: yolo26m_640_default, label: "YOLO26m @640, default recipe", input: "640", members: [yolo26m/default_s0, yolo26m/default_s1, yolo26m/default_s2]}
  - {key: yolo26m_640_e1, label: "YOLO26m @640, E1 recipe", input: "640", members: [yolo26m/yolo26m_e1_s0, yolo26m/yolo26m_e1_s1, yolo26m/yolo26m_e1_s2]}
  - {key: yolo26m_1280, label: "YOLO26m @1280, E1 recipe", input: "1280", members: [yolo26m/yolo26m_1280_s0, yolo26m/yolo26m_1280_s1, yolo26m/yolo26m_1280_s2]}
  - {key: deimm_640_e1, label: "DEIM-M @640, E1 recipe", input: "640", members: [deimm/e1_s0, deimm/e1_s1, deimm/e1_s2]}
  - {key: deimm_1280, label: "DEIM-M @1280, E1 recipe", input: "1280", members: [deimm/1280_s0, deimm/1280_s1, deimm/1280_s2]}
  - {key: llmdet_peft, label: "LLMDet-large, light (peft)", input: "short side 800, long cap 1333", members: [llmdet/peft, llmdet/peft_s1, llmdet/peft_s2]}
  - {key: mmgdino_peft, label: "MM-Grounding-DINO-B, light (peft)", input: "short side 800 (1422x800)", members: [mmgdino/peft, mmgdino/peft_s1, mmgdino/peft_s2]}
  - {key: llmdet_peft_640, label: "LLMDet-large @640, light (peft)", input: "640x360 (long side 640)", members: [llmdet/peft_640_s0, llmdet/peft_640_s1, llmdet/peft_640_s2]}
  - {key: mmgdino_peft_640, label: "MM-Grounding-DINO-B @640, light (peft)", input: "640x360 (long side 640)", members: [mmgdino/peft_640_s0, mmgdino/peft_640_s1, mmgdino/peft_640_s2]}
  - {key: llmdet_peft_640aug, label: "LLMDet-large @640 + matched jitter (E6), light (peft)", input: "640x360 (long side 640)", members: [llmdet/peft_640aug_s0, llmdet/peft_640aug_s1, llmdet/peft_640aug_s2]}
  - {key: mmgdino_peft_640aug, label: "MM-Grounding-DINO-B @640 + matched jitter (E6), light (peft)", input: "640x360 (long side 640)", members: [mmgdino/peft_640aug_s0, mmgdino/peft_640aug_s1, mmgdino/peft_640aug_s2]}
  - {key: owlv2_peft, label: "OWLv2-L/14, light (peft)", input: "1008x1008", members: [owlv2/peft, owlv2/peft_seed1, owlv2/peft_seed2]}

# Which entries each report table shows, and which paired clustered deltas it quotes.
tables:
  headline:
    entries: [deimm_1280, yolo26m_1280, llmdet_peft, llmdet/full, yoloe_1280/yoloe_full, yoloworld/yoloworld_full, mmgdino_peft, sam3/full, deimm_640_e1, yolo26m_640_e1, yoloe_640/yoloe_full_640, llmdet_peft_640, llmdet/full_640_s0, mmgdino_peft_640]
    pairs:
      - [deimm_1280, llmdet_peft]
      - [deimm_1280, llmdet/full]
      - [yolo26m_1280, llmdet_peft]
      - [yolo26m_1280, yoloe_1280/yoloe_full]
      - [deimm_1280, yoloworld/yoloworld_full]
      - [deimm_1280, mmgdino_peft]
      - [llmdet_peft, yolo26m_640_e1]
      - [llmdet_peft, deimm_640_e1]
  e1:
    entries: [YOLO26m, yolo26m_640_default, yolo26m_640_e1, DEIM-M, deimm_640_e1, llmdet_peft]
    pairs:
      - [yolo26m_640_e1, yolo26m_640_default]
      - [yolo26m_640_e1, YOLO26m]
      - [deimm_640_e1, DEIM-M]
      - [llmdet_peft, yolo26m_640_e1]
      - [llmdet_peft, deimm_640_e1]
  e2:
    entries: [yolo26m_640_e1, yolo26m_1280, deimm_640_e1, deimm_1280, llmdet_peft_640, llmdet_peft_640aug, llmdet_peft, llmdet/full_640_s0, llmdet/full, mmgdino_peft_640, mmgdino_peft_640aug, mmgdino_peft, yoloe_640/yoloe_full_640, yoloe_1280/yoloe_full, yoloe_640/yoloe_peft_640, yoloe_1280/yoloe_peft]
    pairs:
      - [yolo26m_1280, yolo26m_640_e1]
      - [deimm_1280, deimm_640_e1]
      - [llmdet_peft, llmdet_peft_640]
      - [llmdet/full, llmdet/full_640_s0]
      - [mmgdino_peft, mmgdino_peft_640]
      - [yoloe_1280/yoloe_full, yoloe_640/yoloe_full_640]
      # E5: every model at the baselines' 640 input.
      - [llmdet_peft_640, yolo26m_640_e1]
      - [llmdet_peft_640, deimm_640_e1]
      - [llmdet/full_640_s0, yolo26m_640_e1]
      - [llmdet/full_640_s0, deimm_640_e1]
      - [mmgdino_peft_640, yolo26m_640_e1]
      - [mmgdino_peft_640, deimm_640_e1]
      # E6: E5 with the round-1 multi-scale jitter restored at the 640 scale.
      - [llmdet_peft_640aug, llmdet_peft_640]
      - [mmgdino_peft_640aug, mmgdino_peft_640]
      - [llmdet_peft_640aug, yolo26m_640_e1]
      - [llmdet_peft_640aug, deimm_640_e1]
      - [mmgdino_peft_640aug, yolo26m_640_e1]
      - [mmgdino_peft_640aug, deimm_640_e1]
      - [yoloe_640/yoloe_full_640, yolo26m_640_e1]
      - [yoloe_1280/yoloe_full, yolo26m_1280]
  e3:
    entries: []
    pairs:
      - [llmdet/peft_frac25_d1, yolo26m/yolo26m_frac25_d1]
      - [mmgdino/peft_frac25_d1, yolo26m/yolo26m_frac25_d1]
      - [yoloe_640/yoloe_full_640_frac25_d1, yolo26m/yolo26m_frac25_d1]
      - [llmdet/peft_frac25_d0, yolo26m/yolo26m_frac25_d0]
      - [yoloe_640/yoloe_full_640_frac25_d0, yolo26m/yolo26m_frac25_d0]

# E2 + E5 resolution parity in both directions: one line per model, the same recipe at
# the baselines' 640 input (`low`) and at the higher input (`high`: 1280 for the
# baselines, the round-1 native input for the grounding models).
parity:
  - {label: "DEIM-M (E1 recipe)", low: deimm_640_e1, high: deimm_1280}
  - {label: "YOLO26m (E1 recipe)", low: yolo26m_640_e1, high: yolo26m_1280}
  - {label: "LLMDet-large, light (peft)", low: llmdet_peft_640, high: llmdet_peft}
  - {label: "LLMDet-large, full", low: llmdet/full_640_s0, high: llmdet/full}
  - {label: "MM-Grounding-DINO-B, light (peft)", low: mmgdino_peft_640, high: mmgdino_peft}
  - {label: "LLMDet-large, light (peft), E6 matched jitter at 640", low: llmdet_peft_640aug, high: llmdet_peft}
  - {label: "MM-Grounding-DINO-B, light (peft), E6 matched jitter at 640", low: mmgdino_peft_640aug, high: mmgdino_peft}

# E3 data scaling: one series per model. `full` is the 100% point (a seed group or a
# row); the subset rows carry their image fraction and draw in meta.json.
scaling:
  - {label: "YOLO26m @640 (E1 recipe)", full: yolo26m_640_e1, subsets: [yolo26m/yolo26m_frac25_d0, yolo26m/yolo26m_frac25_d1, yolo26m/yolo26m_frac50_d0, yolo26m/yolo26m_frac50_d1]}
  - {label: "YOLOE-26x @640 (full)", full: yoloe_640/yoloe_full_640, subsets: [yoloe_640/yoloe_full_640_frac25_d0, yoloe_640/yoloe_full_640_frac25_d1, yoloe_640/yoloe_full_640_frac50_d0, yoloe_640/yoloe_full_640_frac50_d1]}
  - {label: "LLMDet-large (light)", full: llmdet_peft, subsets: [llmdet/peft_frac25_d0, llmdet/peft_frac25_d1, llmdet/peft_frac50_d0, llmdet/peft_frac50_d1]}
  - {label: "MM-Grounding-DINO-B (light)", full: mmgdino_peft, subsets: [mmgdino/peft_frac25_d0, mmgdino/peft_frac25_d1, mmgdino/peft_frac50_d0, mmgdino/peft_frac50_d1]}

# Generative-VLM recipe fixes found in audit (user-approved; test predicted once each).
fixes:
  - {before: paligemma2/peft, after: paligemma2/peft_896, change: "input 448 -> 896 px (google/paligemma2-3b-pt-896), same LoRA + projector recipe", audit: paligemma2}
  - {before: qwen3vl/peft, after: qwen3vl/peft_merger, change: "8B LoRA, vision merger + deepstack mergers unfrozen (upstream tune_mm_mlp)", audit: qwen3vl}
  - {before: qwen3vl/peft_4b, after: qwen3vl/peft_4b_merger, change: "4B LoRA, vision merger + deepstack mergers unfrozen", audit: qwen3vl}

# Audits (results/<slug>/audit/AUDIT.md). The verdict word is parsed from the file;
# `outcome` says what happened to the published numbers.
audits:
  - {slug: owlv2, outcome: "Numbers stand. The light arm is capacity-limited (train fit 0.693 vs val 0.557)."}
  - {slug: yoloe, outcome: "Numbers stand. The linear probe cannot move a box; that is its ceiling."}
  - {slug: florence2, outcome: "Numbers stand. Frozen DaViT limits the LoRA arms, above all on the ball."}
  - {slug: smolvlm2, outcome: "Numbers stand (about 0). The model does not fit its own training images (train 0.008 / 0.016)."}
  - {slug: paligemma2, outcome: "Recipe fix run: 896 px input. Val 0.293 -> 0.447; test predicted once after user approval (0.278 -> 0.432)."}
  - {slug: qwen3vl, outcome: "Recipe fix run: merger unfrozen. Test predicted once each after user approval (8B 0.548 -> 0.570, 4B 0.533 -> 0.588)."}

# TensorRT fp16 engines on a rented T4 (TensorRT 10.3). Value paths are key lists into
# `file` (relative to the sibling results/), or {file, path} for a value kept in another
# file. `applies_to`: the report entries this engine times (same graph).
# status: current | superseded (kept to show what changed) | invalid.
trt:
  - key: yolo26m_640_published
    label: "YOLO26m @640 (published engine)"
    published: YOLO26m
    input: "640x640"
    applies_to: [yolo26m_640_e1, yolo26m_640_default, YOLO26m]
  - key: deimm_640_published
    label: "DEIM-M @640 (published engine)"
    published: DEIM-M
    input: "640x640"
    applies_to: [DEIM-M]
  - key: yolo26m_1280
    label: "YOLO26m @1280 (1280_s0)"
    file: yolo26m/latency_trt_t4.json
    input: "1280x1280"
    gpu_ms: [reported_median_ms]
    gpu_runs: [runs]
    applies_to: [yolo26m_1280]
  - key: deimm_640
    label: "DEIM-M @640 (e1_lr2)"
    file: deimm/latency_t4/trt_deimm_e1_lr2_640.json
    input: "640x640"
    gpu_ms: [reported_median_ms]
    gpu_runs: [runs]
    applies_to: [deimm_640_e1, deimm/e1_s0]
  - key: deimm_1280
    label: "DEIM-M @1280 (1280_s0)"
    file: deimm/latency_t4/trt_deimm_1280_s0_1280.json
    input: "1280x1280"
    gpu_ms: [reported_median_ms]
    gpu_runs: [runs]
    applies_to: [deimm_1280]
  - key: yoloe_full_640
    label: "YOLOE-26x @640 (full)"
    file: yoloe/latency_trt_t4.json
    input: "640x640"
    gpu_ms: [arms, yoloe_full_640, gpu_compute, median_ms]
    gpu_runs: [arms, yoloe_full_640, gpu_compute, runs]
    e2e_ms: [arms, yoloe_full_640, e2e, median_ms]
    pytorch_ms: {file: yoloe/latency_t4.json, path: [runs, yoloe_full_640, reported_median_ms]}
    val_pt: [arms, yoloe_full_640, valid_mAP_50_95, pytorch]
    val_trt: [arms, yoloe_full_640, valid_mAP_50_95, trt_fp16]
    applies_to: [yoloe_640/yoloe_full_640]
  - key: yoloe_full
    label: "YOLOE-26x @1280 (full)"
    file: yoloe/latency_trt_t4.json
    input: "1280x1280"
    gpu_ms: [arms, yoloe_full, gpu_compute, median_ms]
    gpu_runs: [arms, yoloe_full, gpu_compute, runs]
    e2e_ms: [arms, yoloe_full, e2e, median_ms]
    pytorch_ms: {file: yoloe/latency_t4.json, path: [runs, yoloe_full_1280, reported_median_ms]}
    val_pt: [arms, yoloe_full, valid_mAP_50_95, pytorch]
    val_trt: [arms, yoloe_full, valid_mAP_50_95, trt_fp16]
    note: "val gap is the square letterbox, not fp16 (an fp32 engine scores the same)"
    applies_to: [yoloe_1280/yoloe_full]
  - key: yoloworld_full
    label: "YOLO-World-v2-x @1280 (full)"
    file: yoloe/latency_trt_t4.json
    input: "1280x1280"
    gpu_ms: [arms, yoloworld_full, gpu_compute, median_ms]
    gpu_runs: [arms, yoloworld_full, gpu_compute, runs]
    e2e_ms: [arms, yoloworld_full, e2e, median_ms]
    pytorch_ms: {file: yoloe/latency_t4.json, path: [runs, yoloworld_full_1280, reported_median_ms]}
    val_pt: [arms, yoloworld_full, valid_mAP_50_95, pytorch]
    val_trt: [arms, yoloworld_full, valid_mAP_50_95, trt_fp16]
    note: "EfficientNMS in the engine"
    applies_to: [yoloworld/yoloworld_full, yoloworld/yoloworld_peft]
  - key: deimv2_m
    label: "DEIMv2-M (full)"
    file: deimv2/latency_t4.json
    input: "640x640"
    gpu_ms: [tensorrt_fp16, "DEIMv2-M (full)", reported_median_ms]
    gpu_runs: [tensorrt_fp16, "DEIMv2-M (full)", runs]
    pytorch_ms: [pytorch_fp16, "DEIMv2-M (full)", reported_median_ms]
    applies_to: [deimv2_m/full, deimv2_m/peft]
  - key: deimv2_l
    label: "DEIMv2-L (l_full)"
    file: deimv2/latency_t4.json
    input: "640x640"
    gpu_ms: [tensorrt_fp16, "DEIMv2-L (l_full)", reported_median_ms]
    gpu_runs: [tensorrt_fp16, "DEIMv2-L (l_full)", runs]
    pytorch_ms: [pytorch_fp16, "DEIMv2-L (l_full)", reported_median_ms]
    applies_to: [deimv2_l/l_full, deimv2_l/l_peft]
  - key: mmgdino_msda
    label: "MM-Grounding-DINO-B (peft), MSDA plugin"
    file: mmgdino/latency_trt_t4.json
    input: "800x1422"
    gpu_ms: [msda_plugin, gpu_compute, reported_median_ms]
    gpu_runs: [msda_plugin, gpu_compute, runs]
    e2e_ms: [msda_plugin, e2e, reported_median_ms]
    pytorch_ms: [pytorch_fp16_e2e_median_ms]
    val_pt: [msda_plugin, val_mAP_50_95, pytorch_fp32_engine_input]
    val_trt: [msda_plugin, val_mAP_50_95, trt_fp16_plugin]
    note: "GPU-compute runs 12% apart: quote the range; plugin precision loss not isolated"
    applies_to: [mmgdino_peft, mmgdino/peft, mmgdino/full]
  - key: mmgdino_gridsample
    label: "MM-Grounding-DINO-B (peft), ONNX GridSample"
    status: superseded
    file: mmgdino/latency_trt_t4.json
    input: "800x1422"
    gpu_ms: [gpu_compute, reported_median_ms]
    gpu_runs: [gpu_compute, runs]
    e2e_ms: [e2e, reported_median_ms]
    pytorch_ms: [pytorch_fp16_e2e_median_ms]
    val_pt: [val_mAP_50_95, pytorch_fp32_engine_input]
    val_trt: [val_mAP_50_95, trt_fp16]
    note: "superseded by the MSDA plugin engine; slower than PyTorch"
    applies_to: []
  - key: llmdet_msda
    label: "LLMDet-large (peft), MSDA plugin"
    file: llmdet/latency_trt_t4.json
    input: "750x1333"
    gpu_ms: [gpu_compute_median_ms]
    gpu_runs: [variants, plugin_fp16, gpu_compute, runs]
    e2e_ms: [e2e_median_ms]
    pytorch_ms: [pytorch_fp16_t4_e2e_median_ms]
    val_pt: [val_map_50_95_pytorch]
    val_trt: [val_map_50_95_trt]
    note: "fp32 islands do not recover the fp16 loss; an fp32 engine scores -0.18 pt"
    applies_to: [llmdet_peft, llmdet/peft, llmdet/full]
  - key: llmdet_e5_640
    label: "LLMDet-large @640 (peft_640_s0), MSDA plugin"
    file: llmdet/latency_trt_t4.json
    input: "360x640"
    gpu_ms: [e5_640, gpu_compute_median_ms]
    gpu_runs: [e5_640, gpu_compute, runs]
    e2e_ms: [e5_640, e2e_median_ms]
    val_pt: [e5_640, val_map_50_95_pytorch]
    val_trt: [e5_640, val_map_50_95_trt]
    note: "E5 (E6 reuses it: same architecture and 360x640 engine input); same export path as the native engine; a first timing pair right after the build was 12% apart, so the engine was re-timed and the stable pair is reported"
    applies_to: [llmdet_peft_640, llmdet/peft_640_s0, llmdet/peft_640_s1, llmdet/peft_640_s2, llmdet/full_640_s0, llmdet_peft_640aug, llmdet/peft_640aug_s0, llmdet/peft_640aug_s1, llmdet/peft_640aug_s2]
  - key: mmgdino_e5_640
    label: "MM-Grounding-DINO-B @640 (peft_640_s0), MSDA plugin"
    file: mmgdino/latency_trt_t4.json
    input: "360x640"
    gpu_ms: [e5_640, gpu_compute, reported_median_ms]
    gpu_runs: [e5_640, gpu_compute, runs]
    e2e_ms: [e5_640, e2e, reported_median_ms]
    val_pt: [e5_640, val_mAP_50_95, pytorch_fp32_engine_input_360x640]
    val_trt: [e5_640, val_mAP_50_95, trt_fp16_plugin]
    note: "E5 (E6 reuses it: same architecture and engine input); the engine runs the unpadded 360x640 frame (PyTorch pads to 384x640); val PyTorch is fp32 at the engine's input"
    applies_to: [mmgdino_peft_640, mmgdino/peft_640_s0, mmgdino/peft_640_s1, mmgdino/peft_640_s2, mmgdino_peft_640aug, mmgdino/peft_640aug_s0, mmgdino/peft_640aug_s1, mmgdino/peft_640aug_s2]
  - key: sam3_fixed
    label: "SAM 3 (full), --attn-out-3d export"
    file: sam3/latency_trt_t4.json
    input: "1008x1008"
    gpu_ms: [round2, reported, gpu_compute_median_ms]
    gpu_runs: [round2, gpu_compute_runs]
    e2e_ms: [round2, reported, e2e_median_ms]
    pytorch_ms: [pytorch_fp16_reference_ms, e2e_median]
    val_pt: [round2, val_mAP_50_95, pytorch_bf16]
    val_trt: [round2, val_mAP_50_95, trt_fp16]
    note: "round-1 engine gave val 0.000 (TRT 10.3 fp16 mis-computed the ViT attention projection on sm75); fixed by an export rewrite"
    applies_to: [sam3/full, sam3/peft]
  - key: owlv2_full
    label: "OWLv2-L/14 (full)"
    file: owlv2/latency_trt_t4.json
    input: "1008x1008"
    gpu_ms: [gpu_compute, reported_median_ms]
    gpu_runs: [gpu_compute, runs]
    e2e_ms: [e2e, cv2pre, median_ms]
    pytorch_ms: {file: owlv2/latency_t4.json, path: [reported_median_ms]}
    val_pt: [val_mAP_50_95, pytorch]
    val_trt: [val_mAP_50_95, trt_fp16_cv2pre]
    note: "e2e with cv2 pre-processing; the HF image processor alone takes ~470 ms on the CPU"
    applies_to: [owlv2/full, owlv2/peft, owlv2_peft]

# Timings this study does not have, listed in the report so their absence is explicit.
not_timed:
  - {what: "Generative VLMs under TensorRT", why: "token-by-token generation needs TensorRT-LLM, not a TensorRT engine; VLMs are timed in PyTorch only"}
  - {what: "YOLO26m / DEIM-M end to end at 1280", why: "only GPU compute was timed for the retrained baselines"}
