    resolution: "short side 800, long cap 1333"
    licence: Apache-2.0
    redistribution: permissive
    light_trains: "fusion encoder, decoder, heads (Swin-L and BERT frozen)"
    arms:
      peft: peft
      full: full
    extra:
      - {arm: mid, experiment: E4, label: "mid: light + Swin-L stage 4 at lr x0.1"}
      - {arm: peft_frac25_d0, experiment: E3, label: "peft on frac25, draw 0"}
      - {arm: peft_frac25_d1, experiment: E3, label: "peft on frac25, draw 1"}
      - {arm: peft_frac50_d0, experiment: E3, label: "peft on frac50, draw 0"}
      - {arm: peft_frac50_d1, experiment: E3, label: "peft on frac50, draw 1"}
      - {arm: peft_640_s0, experiment: E5, label: "peft @640 (long side 640), seed 0", input: "640x360 (long side 640)"}
      - {arm: peft_640_s1, experiment: E5, label: "peft @640 (long side 640), seed 1", input: "640x360 (long side 640)"}
      - {arm: peft_640_s2, experiment: E5, label: "peft @640 (long side 640), seed 2", input: "640x360 (long side 640)"}
      - {arm: full_640_s0, experiment: E5, label: "full @640 (long side 640)", input: "640x360 (long side 640)"}
      - {arm: peft_640aug_s0, experiment: E6, label: "peft @640 + matched multi-scale jitter, seed 0", input: "640x360 (long side 640); train short 230-384, cap 640"}
      - {arm: peft_640aug_s1, experiment: E6, label: "peft @640 + matched multi-scale jitter, seed 1", input: "640x360 (long side 640); train short 230-384, cap 640"}
      - {arm: peft_640aug_s2, experiment: E6, label: "peft @640 + matched multi-scale jitter, seed 2", input: "640x360 (long side 640); train short 230-384, cap 640"}
    zero_shot: {source: vlm_metrics, key: LLMDet-large}
