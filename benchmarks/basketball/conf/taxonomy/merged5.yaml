# 5-class basketball eval taxonomy: the 10 training classes merged down to 5.
# Reproduces the legacy _EVAL_LABEL_MAP / _NAME_TO_EVAL_ID from the source repo.
name: merged5

# index == eval class id
classes:
  - player
  - ball
  - referee
  - rim
  - number

# canonical class -> source category names that collapse into it
merge:
  player:
    - player-in-possession
    - player-jump-shot
    - player-layup-dunk
    - player-shot-block
  ball:
    - ball-in-basket

# COCO-vocabulary / VLM-prompt aliases -> canonical class.
#
# Adding prompt vocabulary REQUIRES adding it here. remap_detections drops any
# detection whose label has no eval mapping, silently — so an unaliased prompt
# phrase does not score badly, it scores as if the model detected nothing. The
# prompt-search harness (scripts/search_vlm_prompts.py) asserts every candidate
# phrase resolves before it will run, so that failure mode cannot be mistaken
# for a bad prompt.
aliases:
  person: player            # COCO "person"
  sports ball: ball         # COCO "sports ball"
  basketball: ball
  basketball hoop: rim
  hoop: rim
  jersey number: number
  basketball player: player # OWLv2 prompt

  # --- prompt-search vocabulary (260801-e01) -------------------------------
  # Contrastive people split: `referee` and `player` are both people on a
  # court, which is the hardest semantic split in this taxonomy. These phrases
  # describe the visual difference (team uniform vs striped shirt) rather than
  # the role, which is not visible.
  basketball player in a team uniform: player
  referee in a striped shirt: referee

  # Small-object phrasing: `ball` and `rim` are the two classes every model
  # collapses on. These name the appearance rather than the object category.
  orange basketball: ball
  basketball hoop and backboard: rim
  jersey number on a uniform: number

  # --- YOLO-World referee-word investigation (260818-e01, targeted, NOT part
  # of the equal-effort search above) -- see vlm_ablation.yaml's `referee_word`
  # element. YOLO-World is the only committed row with a complete `referee`
  # AP50 collapse (0.000); these candidate phrases probe whether that is a
  # vocabulary fix or a deeper CLIP-encoder blind spot.
  official: referee
  umpire: referee
  man in a striped shirt: referee
  basketball official: referee
  black and white striped shirt: referee
