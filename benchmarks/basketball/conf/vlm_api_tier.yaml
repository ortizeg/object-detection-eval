# vlm_api_tier.yaml -- BILLED, NON-REPRODUCIBLE API baselines.
#
# ⚠️ READ THIS BEFORE RUNNING ANYTHING IN THIS FILE.
#
# Every row here costs money per image and requires a DeepDataSpace API token
# (DDS_API_TOKEN). A reader who clones this repo CANNOT reproduce these numbers.
# That directly conflicts with the project's core value -- "every number the
# blog posts publish must be reproducible from this repo" -- which is exactly
# why these rows live in their OWN manifest rather than in vlm_zeroshot.yaml.
#
# The separation is structural, not cosmetic:
#   - a separate file, so `run_vlm_benchmark.py` with its default manifest can
#     never bill anything by accident;
#   - a separate results directory (results/vlm/api_tier/);
#   - a separate report table, never merged into the open-weights comparison.
#
# These rows exist to answer one question honestly -- "is the open-weights
# ceiling measured here the real ceiling, or just the ceiling of what is free?"
# -- and they are labelled as unreproducible everywhere they appear.
#
# ⚠️ ENDPOINT VERIFICATION STATUS (2026-08-01)
#
# `api_path` and `model` for DINO-X are taken from IDEA-Research's published
# demo. The Grounding DINO 1.5/1.6 Pro strings could NOT be verified against
# upstream source and are BEST-GUESS. They live here, in config, so correcting
# them is a one-line edit. Verify against the DeepDataSpace docs before
# trusting any number produced from these rows.
#
# COST CONTROL: `max_billed_calls` is a hard per-model cap enforced by the
# inferencer, which RAISES when hit rather than quietly returning nothing. The
# 94-image test split needs 94 calls per model; the cap is set just above that
# so a retry loop or an accidental re-run cannot silently multiply the bill.

tolerance: 0.02

# The 94-image test split plus a small margin. Deliberately NOT generous.
max_billed_calls: 100

models:
  # DINO-X Pro -- 59.8 AP LVIS-minival, the strongest open-vocabulary detector
  # available at time of writing.
  - name: dinox_pro
    inferencer: dds_cloud
    model_name: DINO-X-1.0
    api_path: /v2/task/dinox/detection
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.25
    iou_threshold: 0.8
    # No target until a verified run exists. A guessed target would gate the
    # run against a number nobody measured.
    expected_map5095: null

  # Grounding DINO 1.6 Pro -- 55.7 AP LVIS-minival. Same SDK, same request
  # shape; only api_path/model differ, which is why one inferencer covers both.
  # ⚠️ api_path and model are UNVERIFIED -- see the header.
  - name: grounding_dino_16_pro
    inferencer: dds_cloud
    model_name: GroundingDino-1.6-Pro
    api_path: /v2/task/grounding_dino/detection
    classes:
      - basketball player
      - basketball
      - referee
      - basketball hoop
      - jersey number
    box_threshold: 0.25
    iou_threshold: 0.8
    expected_map5095: null
