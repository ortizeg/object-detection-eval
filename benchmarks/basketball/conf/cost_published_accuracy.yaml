# Published test-split accuracy joined onto each pipeline's cost (quick task 261027-q49).
#
# COPIED, never recomputed: every value names where it was read. Two kinds of source:
#   - `quote`: a verbatim single-line substring of a Markdown report, which must
#     contain the value formatted to 3 decimals;
#   - `json_path`: a key path into a committed results file, which must equal the
#     value to 3 decimals. `[key=value]` selects the list element whose `key` field
#     equals `value`.
# tests/cost/test_compute.py::test_citation_integrity checks every entry against the
# real files, so a drifted report fails CI instead of silently disagreeing.
#
# A null value carries a `reason`:
#   not published                 - no report or results file prints it
#   never reaches 95% precision   - the report states the line never reaches 95% precision
schema_version: 1
split: test

pipelines:
  astra:
    label: "GPT-6 Astra (single pass)"
    kind: pipeline
    test_map5095:
      value: 0.501
      source:
        file: benchmarks/basketball/reports/VLM_VS_FINETUNED.md
        section: The zero-shot ceiling (vlm_summary table)
        quote: "| GPT-6 Astra | 0.501 | 0.823 | 0.507 |"
    recall_at_p95:
      value: 0.908
      source:
        file: benchmarks/basketball/results/vlm/fusion/api_fusion_gemini_test.json
