[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "object-detection-eval"
version = "0.1.0"
description = "Reproducible evaluation harness for object detection networks on small datasets"
authors = [{ name = "Enrique G. Ortiz", email = "ortizeg@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2.0.0",
    "onnxruntime>=1.23.2,<2",
    "opencv-python",
    "pydantic>=2.0",
    "hydra-core",
    "loguru",
    "supervision==0.29.1",
    "pycocotools",
    "matplotlib",
    "tqdm",
    "orjson",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
# Zero-shot VLM inferencers. Heavy: pulls the full torch stack.
vlm = [
    "torch",
    "torchvision",
    # Lower bound was justified by SmolVLM2, removed 2026-07-30. Pin RETAINED
    # unrevalidated: the 4 remaining VLMs may need it, and <4.52 guards the
    # HF post-processing drift the VLM gate is sensitive to. Relaxing it
    # requires re-running the VLM reproduction gate on a GPU.
    "transformers>=4.49.0,<4.52.0",
    "timm",                          # OmDet-Turbo backbone (AutoBackbone)
    "einops",                        # Florence-2
    "peft",
    # num2words was SmolVLM2's processor dep (removed 2026-07-30) and nothing in
    # this repo imports it. RETAINED unrevalidated: it is pulled in by HF
    # processor code paths at runtime, not by our imports, so dropping it needs
    # a GPU re-run of the VLM gate to prove the other 4 models still load.
    "num2words",
    "google-genai>=1.63.0,<2",
]
# TensorRT latency benchmarking. Linux-64 + NVIDIA only.
# Versions pinned to the 06-RESEARCH.md-verified releases (2026-07-28). CRUCIALLY
# onnx-graphsurgeon>=0.6.1: 0.5.8 calls the removed onnx.helper.float32_to_bfloat16
# and breaks against onnx>=1.20 (06-RESEARCH.md Pitfall 2); 0.6.1 (2026-04-08) fixes it.
trt = [
    "onnxruntime-gpu>=1.28.0,<2",
    "tensorrt>=10.16,<11",
    "onnx>=1.22,<2",
    "onnx-graphsurgeon>=0.6.1",
]

[project.scripts]
ode = "object_detection_eval.cli:main"

[project.urls]
Homepage = "https://github.com/ortizeg/object-detection-eval"
Issues = "https://github.com/ortizeg/object-detection-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/object_detection_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/provenance/configs/ holds frozen third-party training configs (mmdet, DAMO-YOLO,
# rfdetr, etc.) copied verbatim as an irreplaceable historical record. They follow their
# own upstream frameworks' style, not this repo's conventions, and must never be rewritten.
extend-exclude = ["docs/provenance/configs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "T20", # flake8-print — loguru only, never print()
    "SIM", # simplify
    "RUF", # ruff-specific
]

# The report renderers emit prose read by humans, where the multiplication sign
# is correct typography ("1920×1080"), not a confusable typo for the letter x.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # assert is the point of a test

[tool.ruff.lint.isort]
known-first-party = ["object_detection_eval"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
# NOTE: disallow_any_explicit is intentionally NOT enabled. It flags every
# `pydantic.BaseModel` subclass as explicit-Any (even with the pydantic mypy
# plugin), and pydantic is foundational here — every schema, model card, and
# config is a BaseModel. `strict = true` keeps the meaningful rigor.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "supervision.*",
    "pycocotools.*",
    "onnxruntime.*",
    "matplotlib.*",
    "hydra.*",
    "omegaconf.*",
    "tqdm.*",
    "orjson.*",
    "transformers.*",
    "timm.*",
    "einops.*",
    "peft.*",
    "google.*",
    "tensorrt.*",
    "onnx_graphsurgeon.*",
    # torch/torchvision/PIL are [vlm]-extra-only and not installed in the
    # default (torch-free) env that `pixi run typecheck` (CI) runs in.
    "torch.*",
    "torchvision.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# VLM/annotate modules are torch-gated behind the `[vlm]` extra; their tests
# are `vlm`-marked and skipped by default CI (`-m "not vlm and not trt and
# not external"`), so their statements are never executed in that run. Omit
# them here so the core's --cov-fail-under=80 gate stays meaningful instead
# of cratering under ~900 uncovered torch-gated statements.
omit = [
    "src/object_detection_eval/inference/vlm/*",
    "src/object_detection_eval/annotate/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term --cov-report=xml --cov-fail-under=80"
markers = [
    "vlm: requires the [vlm] optional dependency group",
    "trt: requires a CUDA GPU and the [trt] optional dependency group",
    "graphsurgeon: requires onnx + onnx-graphsurgeon CPU graph tooling (the [trt] extra's graph-surgery subset), but NOT a CUDA GPU",
    "external: hits an external API (needs credentials)",
]
